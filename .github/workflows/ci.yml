name: Full Stack CI/CD

on:
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # Backend
      - name: Install Backend
        run: |
          cd backend
          npm install

      - name: Test Backend
        run: |
          cd backend
          npm test

      # Frontend
      - name: Install Frontend
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build

  docker-build-push:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Backend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/stack-backend:latest ./backend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/stack-backend:latest

      - name: Build & Push Frontend Image
        run: |
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/stack-frontend:latest ./frontend
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/stack-frontend:latest

  deploy:
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest images..."
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/stack-backend:latest
            docker pull ${{ secrets.DOCKERHUB_USERNAME }}/stack-frontend:latest

            echo "Stopping old containers..."
            docker stop backend frontend 2>/dev/null || true
            docker rm backend frontend 2>/dev/null || true

            echo "Creating network..."
            docker network create stack 2>/dev/null || true

            echo "Starting backend..."
            docker run -d --name backend --network stack --restart always \
              -p 3000:3000 \
              ${{ secrets.DOCKERHUB_USERNAME }}/stack-backend:latest

            echo "Starting frontend..."
            docker run -d --name frontend --network stack --restart always \
              -p 80:80 \
              ${{ secrets.DOCKERHUB_USERNAME }}/stack-frontend:latest

            echo "Cleaning up old images..."
            docker image prune -f

            echo "Deployment completed!"
