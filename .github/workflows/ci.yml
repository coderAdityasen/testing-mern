name: Full Stack CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      # Backend
      - name: Install Backend
        run: |
          cd backend
          npm install

      - name: Test Backend
        run: |
          cd backend
          npm test

      # Frontend
      - name: Install Frontend
        run: |
          cd frontend
          npm install

      - name: Build Frontend
        run: |
          cd frontend
          npm run build